[project]
name = "radar-tren-desain"
version = "0.1.0"
description = "Radar sinyal tren desain mingguan untuk HOG (Pinterest, TikTok CC, AniList -> Google Sheet)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "gspread>=6.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
radar = "radar.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radar*"]
